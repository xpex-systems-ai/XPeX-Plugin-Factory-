name: Live Agent Framework Connection

on:
  push:
    branches: [ci/real-framework-mcp-smoke]
    paths:
      - .github/workflows/agent-framework-smoke.yml
      - examples/langchain_xpex.py
      - examples/crewai_xpex.py
  pull_request:
    paths:
      - .github/workflows/agent-framework-smoke.yml
      - examples/langchain_xpex.py
      - examples/crewai_xpex.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install framework MCP clients
        run: python -m pip install 'langchain[mcp]>=1.4.0' 'crewai-tools[mcp]'
      - name: LangChain connects and calls the free offer tool
        run: python examples/langchain_xpex.py
      - name: CrewAI connects and discovers the free offer tool
        run: python examples/crewai_xpex.py
