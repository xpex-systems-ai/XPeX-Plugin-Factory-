name: Live Production Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run production smoke
        env:
          FACTORY_BASE_URL: https://gxeon-agent-gateway-production.up.railway.app
        run: node scripts/live-smoke.mjs
