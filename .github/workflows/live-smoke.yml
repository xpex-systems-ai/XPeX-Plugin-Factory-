name: Live Production Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run production smoke
        env:
          FACTORY_BASE_URL: https://gxeon-agent-gateway-production.up.railway.app
        run: node scripts/live-smoke.mjs

      - name: Verify production Factory and MCP Agent Kit
        env:
          FACTORY_URL: https://xpex-plugin-factory-production.up.railway.app
        run: node scripts/production-smoke.mjs

      - name: Check official MCP Registry listing
        run: |
          curl -fsSL --max-time 20 \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.xpex-systems-ai%2Fxpex-plugin-factory' \
            | jq '{matching: [.servers[]? | select(.server.name == "io.github.xpex-systems-ai/xpex-plugin-factory") | {name: .server.name, version: .server.version, status: ._meta["io.modelcontextprotocol.registry/official"].status}]}'
